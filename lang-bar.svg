<svg xmlns="http://www.w3.org/2000/svg" width="860" height="144"
     viewBox="0 0 860 144" role="img"
     aria-label="Language mix across public repositories">
  <style>
    text { font: 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .hdr { font-size: 13px; fill: #39d353; }
    .lab { fill: #c9d1d9; }
    .pct { fill: #7d8590; }
    /* Base state is the finished state; `both` holds the collapsed from-state
       during the delay, so non-animating renderers still show a full bar. */
    .seg { transform-box: fill-box; transform-origin: left center;
            animation: grow .7s cubic-bezier(.2,.8,.3,1) both; }
    @keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
    .lg { animation: fade .4s ease-out both; }
    @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) {
      .seg, .lg { animation: none; }
    }
  </style>
  <rect width="100%" height="100%" fill="#0d1117" rx="10"/>
  <text class="hdr" x="24" y="32">language mix · by bytes across public repos</text>
  <g><rect class="seg" x="24" y="44" width="419" height="16" fill="#e34c26" style="animation-delay:0.0s"><title>HTML — 51.6%</title></rect><rect class="seg" x="443" y="44" width="261" height="16" fill="#3572A5" style="animation-delay:0.11s"><title>Python — 32.2%</title></rect><rect class="seg" x="704" y="44" width="48" height="16" fill="#f1e05a" style="animation-delay:0.22s"><title>JavaScript — 5.9%</title></rect><rect class="seg" x="752" y="44" width="31" height="16" fill="#3178c6" style="animation-delay:0.33s"><title>TypeScript — 3.9%</title></rect><rect class="seg" x="783" y="44" width="29" height="16" fill="#89e051" style="animation-delay:0.44s"><title>Shell — 3.5%</title></rect><rect class="seg" x="812" y="44" width="24" height="16" fill="#563d7c" style="animation-delay:0.55s"><title>CSS — 2.9%</title></rect></g>
  <g class="lg" style="animation-delay:0.5s"><circle cx="29" cy="82" r="5" fill="#e34c26"/><text class="lab" x="41" y="86">HTML <tspan class="pct">51.6%</tspan></text></g><g class="lg" style="animation-delay:0.57s"><circle cx="299" cy="82" r="5" fill="#3572A5"/><text class="lab" x="311" y="86">Python <tspan class="pct">32.2%</tspan></text></g><g class="lg" style="animation-delay:0.64s"><circle cx="569" cy="82" r="5" fill="#f1e05a"/><text class="lab" x="581" y="86">JavaScript <tspan class="pct">5.9%</tspan></text></g><g class="lg" style="animation-delay:0.71s"><circle cx="29" cy="104" r="5" fill="#3178c6"/><text class="lab" x="41" y="108">TypeScript <tspan class="pct">3.9%</tspan></text></g><g class="lg" style="animation-delay:0.78s"><circle cx="299" cy="104" r="5" fill="#89e051"/><text class="lab" x="311" y="108">Shell <tspan class="pct">3.5%</tspan></text></g><g class="lg" style="animation-delay:0.85s"><circle cx="569" cy="104" r="5" fill="#563d7c"/><text class="lab" x="581" y="108">CSS <tspan class="pct">2.9%</tspan></text></g>
</svg>
